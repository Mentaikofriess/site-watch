name: watch
# Every 5 minutes (Lucas, 2026-09-24): outages here usually last a few minutes,
# which an hourly check misses. Free because the repo is public (Actions on
# public repos aren't billed). GitHub may start scheduled runs late or skip
# some under load, so "every 5 min" is really "about every 5–15 min"; the
# digest reports how many checks actually ran. The Mac-side run stays hourly.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node check.mjs --vantage github
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: commit state
        run: |
          git config user.name "site-watch"
          git config user.email "site-watch@users.noreply.github.com"
          git add state/github
          git diff --cached --quiet || git commit -q -m "state: check [skip ci]"
          git pull -q --rebase && git push -q
